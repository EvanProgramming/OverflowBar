name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # Liquid Glass and Icon Composer require the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Eq '^Xcode 26[.]' <<< "$xcode_version"
      - name: Validate metadata and scripts
        run: |
          plutil -lint OverflowBar/Resources/Info.plist
          bash -n scripts/create-dmg.sh
          bash scripts/check-native-engine.sh
          bash scripts/validate-homebrew-cask.sh
          ruby scripts/check-doc-links.rb
      - name: Build Debug
        run: >-
          xcodebuild -project OverflowBar.xcodeproj -scheme OverflowBar
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath .ci-build CODE_SIGN_IDENTITY="-" build
      - name: Run macOS XCTest suite
        run: >-
          xcodebuild -project OverflowBar.xcodeproj -scheme OverflowBar
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath .ci-build CODE_SIGN_IDENTITY="-" test
      - name: Build Release
        run: >-
          xcodebuild -project OverflowBar.xcodeproj -scheme OverflowBar
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath .ci-release CODE_SIGN_IDENTITY="-" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
